name: CD — EAS Build (Android)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      profile:
        description: 'EAS Build profile'
        required: true
        default: 'preview'
        type: choice
        options:
          - preview
          - production
          - development
      platform:
        description: 'Target platform'
        required: true
        default: 'android'
        type: choice
        options:
          - android
          - ios
          - all

concurrency:
  group: cd-mobile-eas-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  quality-gate:
    name: Pre-Build Typecheck & Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript typecheck
        run: npx tsc --noEmit

      - name: ESLint (Expo)
        run: npx expo lint

  eas-build:
    name: Trigger EAS Cloud Build
    needs: quality-gate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Validate EXPO_TOKEN secret
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::Secret EXPO_TOKEN is not configured. Generate an access token at https://expo.dev/settings/access-tokens and add it to GitHub Repository Secrets."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Setup Expo & EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Resolve build parameters
        id: params
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            PROFILE="${{ inputs.profile }}"
            PLATFORM="${{ inputs.platform }}"
          else
            PROFILE="preview"
            PLATFORM="android"
          fi
          echo "profile=${PROFILE}" >> "$GITHUB_OUTPUT"
          echo "platform=${PLATFORM}" >> "$GITHUB_OUTPUT"

      - name: Queue EAS Build
        run: |
          eas build \
            --platform "${{ steps.params.outputs.platform }}" \
            --profile "${{ steps.params.outputs.profile }}" \
            --non-interactive \
            --no-wait

      - name: Publish build summary
        run: |
          {
            echo "## BenchOS Mobile — EAS Build Queued"
            echo ""
            echo "- **Ref:** \`${GITHUB_REF_NAME}\` (\`${GITHUB_SHA::7}\`)"
            echo "- **Platform:** \`${{ steps.params.outputs.platform }}\`"
            echo "- **Profile:** \`${{ steps.params.outputs.profile }}\`"
            echo "- **Artifact:** $([ "${{ steps.params.outputs.profile }}" = "production" ] && echo ".aab (Play Store)" || echo ".apk (Instalação direta)")"
            echo "- **Acompanhe o progresso e baixe o artefato em:** https://expo.dev"
          } >> "$GITHUB_STEP_SUMMARY"
