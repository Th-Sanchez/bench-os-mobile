name: CD — Release & EAS Build

on:
  push:
    branches: [master]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
  workflow_dispatch:
    inputs:
      profile:
        description: 'EAS Build profile'
        required: true
        default: 'preview'
        type: choice
        options:
          - preview
          - production
          - development
      platform:
        description: 'Target platform'
        required: true
        default: 'android'
        type: choice
        options:
          - android
          - ios
          - all
      create_release:
        description: 'Bump SemVer version & create GitHub Release'
        required: false
        default: false
        type: boolean

concurrency:
  group: cd-mobile-eas-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  quality-gate:
    name: Pre-Build Typecheck & Lint
    if: ${{ !startsWith(github.event.head_commit.message, 'chore(release):') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript typecheck
        run: npx tsc --noEmit

      - name: ESLint (Expo)
        run: npx expo lint

  release-and-build:
    name: SemVer Release & EAS Build
    needs: quality-gate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Validate EXPO_TOKEN secret
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::Secret EXPO_TOKEN is not configured. Generate an access token at https://expo.dev/settings/access-tokens and add it to GitHub Repository Secrets."
            exit 1
          fi

      - name: Checkout repository (full history for SemVer)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Calculate SemVer & bump version
        id: release
        env:
          SHOULD_RELEASE: ${{ github.event_name == 'push' || inputs.create_release == true }}
        run: |
          node << 'EOF'
          const fs = require('node:fs');
          const { execSync } = require('node:child_process');

          const shouldRelease = process.env.SHOULD_RELEASE === 'true';
          const appJson = JSON.parse(fs.readFileSync('app.json', 'utf8'));
          const pkgJson = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const currentVersion = appJson.expo?.version || pkgJson.version || '1.0.0';

          const out = (k, v) => fs.appendFileSync(process.env.GITHUB_OUTPUT, `${k}=${v}\n`);

          if (!shouldRelease) {
            out('version', currentVersion);
            out('tag', `v${currentVersion}`);
            out('released', 'false');
            process.exit(0);
          }

          const lastTag = execSync("git tag --list 'v*.*.*' --sort=-v:refname", { encoding: 'utf8' })
            .split('\n')
            .map((s) => s.trim())
            .filter(Boolean)[0] || '';

          const baseStr = lastTag ? lastTag.replace(/^v/, '') : currentVersion;
          const [maj, min, pat] = baseStr.split('.').map((n) => Number.parseInt(n, 10) || 0);

          const range = lastTag ? `${lastTag}..HEAD` : 'HEAD~10..HEAD';
          let logRaw = '';
          try {
            logRaw = execSync(`git log ${range} --no-merges --format=%s%n%b%n---COMMIT---`, { encoding: 'utf8' });
          } catch {
            logRaw = execSync('git log --no-merges --format=%s%n%b%n---COMMIT---', { encoding: 'utf8' });
          }

          const commits = logRaw
            .split('---COMMIT---')
            .map((c) => c.trim())
            .filter((c) => c && !c.startsWith('chore(release):'));

          let bump = 'patch';
          for (const msg of commits) {
            const subject = msg.split('\n')[0] || '';
            if (/BREAKING CHANGE:/i.test(msg) || /^[a-z]+(\([^)]+\))?!:/.test(subject)) {
              bump = 'major';
              break;
            }
            if (/^(feat|feature)(\([^)]+\))?:/i.test(subject)) {
              bump = 'minor';
            }
          }

          let nextVersion;
          if (bump === 'major') nextVersion = `${maj + 1}.0.0`;
          else if (bump === 'minor') nextVersion = `${maj}.${min + 1}.0`;
          else nextVersion = `${maj}.${min}.${pat + 1}`;

          appJson.expo.version = nextVersion;
          pkgJson.version = nextVersion;
          fs.writeFileSync('app.json', JSON.stringify(appJson, null, 2) + '\n');
          fs.writeFileSync('package.json', JSON.stringify(pkgJson, null, 2) + '\n');

          const notesLines = commits
            .map((c) => c.split('\n')[0])
            .filter(Boolean)
            .map((s) => `- ${s}`);
          fs.writeFileSync(
            '/tmp/release-notes.md',
            (notesLines.length ? notesLines.join('\n') : '- Automated release') + '\n'
          );

          out('version', nextVersion);
          out('tag', `v${nextVersion}`);
          out('bump', bump);
          out('released', 'true');
          EOF

      - name: Commit bumped version, push tag & create GitHub Release
        if: steps.release.outputs.released == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.json package.json
          git commit -m "chore(release): ${TAG} [skip ci]"
          git tag -a "${TAG}" -m "Release ${TAG}"
          git push origin HEAD:master --follow-tags
          gh release create "${TAG}" \
            --title "BenchOS Mobile ${TAG}" \
            --notes-file /tmp/release-notes.md

      - name: Setup Expo & EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Resolve build parameters
        id: params
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            PROFILE="${{ inputs.profile }}"
            PLATFORM="${{ inputs.platform }}"
          else
            PROFILE="preview"
            PLATFORM="android"
          fi
          echo "profile=${PROFILE}" >> "$GITHUB_OUTPUT"
          echo "platform=${PLATFORM}" >> "$GITHUB_OUTPUT"

      - name: Queue EAS Build
        run: |
          eas build \
            --platform "${{ steps.params.outputs.platform }}" \
            --profile "${{ steps.params.outputs.profile }}" \
            --non-interactive \
            --no-wait

      - name: Publish build summary
        run: |
          {
            echo "## BenchOS Mobile — Release & EAS Build"
            echo ""
            echo "- **Version:** \`${{ steps.release.outputs.tag }}\` (${{ steps.release.outputs.released == 'true' && steps.release.outputs.bump || 'manual' }})"
            echo "- **Platform:** \`${{ steps.params.outputs.platform }}\`"
            echo "- **Profile:** \`${{ steps.params.outputs.profile }}\` (\`versionCode\` auto-incremented by EAS)"
            echo "- **Artifact:** $([ "${{ steps.params.outputs.profile }}" = "production" ] && echo ".aab (Play Store)" || echo ".apk (Instalação direta)")"
            echo "- **Acompanhe o progresso e baixe o artefato em:** https://expo.dev"
          } >> "$GITHUB_STEP_SUMMARY"
